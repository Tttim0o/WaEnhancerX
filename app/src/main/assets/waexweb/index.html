<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>WAEX Web</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true" style="display:none">
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.6"/><circle cx="8" cy="17" r="2.6"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-emoji" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.2c1 1.4 2.2 2.1 3.5 2.1s2.5-.7 3.5-2.1"/><path d="M9 9.8v.4M15 9.8v.4" stroke-width="2.4"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M3.4 20.4 21 12 3.4 3.6 3 10l12 2-12 2z"/></symbol>
  <symbol id="i-reply" viewBox="0 0 24 24"><path d="M10 7l-5 5 5 5"/><path d="M5 12h9a5 5 0 0 1 5 5v1"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5.5 12.5l4.5 4.5 8.5-9.5"/></symbol>
  <symbol id="i-checks" viewBox="0 0 24 24"><path d="M2 12.5l4.5 4.5L15 7.5"/><path d="M11.5 15.5L13 17l8.5-9.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 8v4.3l2.5 2"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10.5 11v5M13.5 11v5"/></symbol>
  <symbol id="i-block" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11"/></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3 3-2.5 4.5 4"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2.5"/><path d="M15 10.5l6-3v9l-6-3"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.7"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></symbol>
  <symbol id="i-poll" viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
  <symbol id="i-chats" viewBox="0 0 24 24"><path d="M5 5h14a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 19 18h-7.5L7 21.5V18H5a2.5 2.5 0 0 1-2.5-2.5v-8A2.5 2.5 0 0 1 5 5z"/><path d="M7.5 10h9M7.5 13.5h5.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path stroke-width="2.6" d="M12 5.5v.01M12 12v.01M12 18.5v.01"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l11-6.8a.8.8 0 0 0 0-1.4l-11-6.8A.8.8 0 0 0 8 5.200z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.500z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><path stroke-width="2.4" d="M12 7.6v.01"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.400-6.400L12 5.600"/><path d="M14 10a4.5 4.5 0 0 0-6.400 0l-3 3a4.5 4.5 0 0 0 6.400 6.400l1-1"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19.500 12a7.500 7.500 0 1 1-2.200-5.300"/><path d="M19.500 4v4.500H15"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.500v5.500"/><path stroke-width="2.400" d="M12 16.400v.010"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.500 12S6 5.500 12 5.500 21.500 12 21.500 12 18 18.500 12 18.500 2.500 12 2.500 12z"/><circle cx="12" cy="12" r="2.800"/></symbol>
  <symbol id="i-status" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 1 8.4 5.8M21 12a9 9 0 0 1-3.1 6.8M14.2 20.7a9 9 0 0 1-5.9-.3M5.2 18A9 9 0 0 1 3 12M4.7 6.6A9 9 0 0 1 8.6 3.7"/><circle cx="12" cy="12" r="4"/></symbol>
  <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.6A10 10 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.2 4M6.6 6.7C4 8.4 2.5 12 2.5 12S6 18.5 12 18.5a9.6 9.6 0 0 0 4.3-1"/><path d="M9.9 9.9a2.8 2.8 0 0 0 4 4"/></symbol>
  <symbol id="i-channel" viewBox="0 0 24 24"><path d="M4 10v4a1 1 0 0 0 1 1h2l5 4V5L7 9H5a1 1 0 0 0-1 1z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
  <symbol id="i-laptop" viewBox="0 0 120 80"><rect x="22" y="8" width="76" height="50" rx="5"/><path d="M8 66h104l-6 7H14z"/><rect x="74" y="26" width="18" height="30" rx="3" fill="var(--panel)"/><path d="M36 24h26M36 33h18M36 42h22"/></symbol>
</svg>
<noscript>WAEX Web needs JavaScript.</noscript>

<main id="login" class="login" hidden>
  <div class="card">
    <div class="logo">WAEX <span>Web</span></div>
    <h1 id="loginTitle"></h1>
    <ol class="howto">
      <li id="how1"></li>
      <li id="how2"></li>
      <li id="how3"></li>
    </ol>
    <div id="loginStep1">
      <button id="askCode" class="primary wide"></button>
    </div>
    <form id="loginStep2" hidden autocomplete="off">
      <label id="codeLabel" for="code"></label>
      <input id="code" inputmode="numeric" maxlength="7" autocomplete="one-time-code" placeholder="000 000">
      <div id="passwordRow" hidden>
        <label id="passwordLabel" for="password"></label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <button id="confirmCode" class="primary wide" type="submit"></button>
      <button id="newCode" class="link" type="button"></button>
    </form>
    <p id="loginError" class="error" role="alert"></p>
    <p id="loginNote" class="muted small"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg><span></span></p>
  </div>
</main>

<div id="app" class="app" hidden>
  <nav id="rail" class="rail">
    <button id="railChats" class="icon on"><svg class="ic" aria-hidden="true"><use href="#i-chats"/></svg><span id="railCount" class="badge" hidden></span></button>
    <button id="railStatus" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-status"/></svg><span id="railStatusDot" class="dot" hidden></span></button>
    <button id="railChannels" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-channel"/></svg><span id="railChannelDot" class="dot" hidden></span></button>
    <span class="grow"></span>
    <button id="accountButton" class="acctbtn" type="button" hidden></button>
    <button id="toggleTheme" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-theme"/></svg></button>
    <button id="openSettings" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg></button>
  </nav>

  <aside id="side" class="side">
    <header class="bar">
      <div class="logo small">WAEX <span>Web</span></div>
      <div id="sideTitle" class="name sidetitle"></div>
    </header>
    <div class="searchbox">
      <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="search" type="search" autocomplete="off">
    </div>
    <div id="tabs" class="tabs">
      <button data-tab="all" class="on"></button>
      <button data-tab="unread"></button>
      <button data-tab="groups"></button>
      <button data-tab="archived"></button>
    </div>
    <div id="offline" class="offline" role="status" hidden></div>
    <div id="chats" class="chats" role="list"></div>
    <div id="sideGrip" class="grip" aria-hidden="true"></div>
  </aside>

  <aside id="statusSide" class="side statusside" hidden>
    <header class="bar">
      <button id="statusBack" class="icon back"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
      <div id="statusTitle" class="name grow"></div>
    </header>
    <p id="statusHint" class="statushint muted small"><svg class="ic" aria-hidden="true"><use href="#i-eyeoff"/></svg><span></span></p>
    <div id="statusList" class="chats" role="list"></div>
  </aside>

  <section id="pane" class="pane">
    <div id="empty" class="empty">
      <svg class="art" aria-hidden="true"><use href="#i-laptop"/></svg>
      <h2 id="emptyTitle"></h2>
      <p id="emptyText" class="muted"></p>
      <p id="emptyHint" class="muted hint"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg><span></span></p>
    </div>
    <div id="chat" class="chat" hidden>
      <header class="bar">
        <button id="back" class="icon back"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
        <button id="chatHead" class="chathead" type="button">
          <span id="chatAvatar" class="avatar"></span>
          <span class="grow titlebox">
            <span id="chatName" class="name"></span>
            <span id="chatSub" class="muted small"></span>
          </span>
        </button>
        <button id="findOpen" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></button>
        <button id="phoneOpen" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg></button>
        <button id="infoOpen" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-more"/></svg></button>
      </header>
      <div id="findBar" class="findbar" hidden>
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="findText" type="search" autocomplete="off">
        <span id="findCount" class="muted small"></span>
        <button id="findPrev" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-up"/></svg></button>
        <button id="findNext" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-down"/></svg></button>
        <button id="findClose" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <div id="messages" class="messages" tabindex="-1"></div>
      <button id="toLatest" class="tolatest" hidden><svg class="ic" aria-hidden="true"><use href="#i-down"/></svg><span id="latestCount" class="badge" hidden></span></button>
      <div id="channelNote" class="channelnote"></div>
      <div class="dock">
        <div id="emojiPanel" class="emojipop" hidden></div>
        <div id="sendNote" class="sendnote" hidden></div>
        <div class="composer">
          <div id="sendAs" class="sendas" hidden></div>
          <div id="replyBar" class="replybar" hidden>
            <div class="grow replybox"><div id="replyWho" class="sender"></div><div id="replyText" class="replytext"></div></div>
            <button id="replyCancel" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
          </div>
          <div class="writerow">
            <button id="emojiButton" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-emoji"/></svg></button>
            <textarea id="text" rows="1" maxlength="8000"></textarea>
            <button id="send" class="round send"><svg class="ic" aria-hidden="true"><use href="#i-send"/></svg></button>
          </div>
        </div>
      </div>
    </div>
    <aside id="info" class="info" hidden>
      <header class="bar">
        <button id="infoClose" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
        <div id="infoTitle" class="name grow"></div>
      </header>
      <div id="infoBody" class="infobody"></div>
    </aside>
  </section>
</div>

<div id="viewer" class="viewer" hidden>
  <header>
    <div class="grow"><div id="viewerWho" class="name"></div><div id="viewerWhen" class="small"></div></div>
    <a id="viewerSave" class="icon" download><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg></a>
    <button id="viewerClose" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
  </header>
  <button id="viewerPrev" class="icon nav prev"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
  <div id="viewerStage" class="stage"></div>
  <button id="viewerNext" class="icon nav next"><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg></button>
  <p id="viewerCaption" class="caption"></p>
</div>

<div id="story" class="story" hidden>
  <div class="storyframe">
    <div id="storyBars" class="storybars"></div>
    <header class="storyhead">
      <span id="storyAvatar" class="avatar"></span>
      <div class="grow"><div id="storyName" class="name"></div><div id="storyWhen" class="small"></div></div>
      <button id="storyPause" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-pause"/></svg></button>
      <a id="storySave" class="icon" download><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg></a>
      <button id="storyClose" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </header>
    <div id="storyStage" class="storystage"></div>
    <p id="storyCaption" class="storycaption"></p>
    <button id="storyPrev" class="storynav prev" tabindex="-1"></button>
    <button id="storyNext" class="storynav next" tabindex="-1"></button>
  </div>
  <button id="storyPrevPerson" class="icon storyperson prev"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
  <button id="storyNextPerson" class="icon storyperson next"><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg></button>
</div>

<dialog id="settings" class="settings">
  <header class="bar">
    <div id="settingsTitle" class="name grow"></div>
    <button id="closeSettings" class="icon"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
  </header>
  <nav id="settingsNav" class="setnav"></nav>
  <div id="settingsBody" class="settingsbody"></div>
</dialog>

<dialog id="ask" class="ask">
  <h2 id="askTitle"></h2>
  <p id="askText" class="muted"></p>
  <div id="askButtons" class="askbuttons"></div>
</dialog>

<div id="menu" class="menu" role="menu" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
